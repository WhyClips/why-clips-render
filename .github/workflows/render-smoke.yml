# Post-chain bisection smoke test (v3, round 2): V1 (ink off) was STILL grey,
# V2 (tone only) was FULL COLOUR — so the desaturator is lens, bloom or grade.
# All three variants below keep ink OFF to isolate those three.
# V4 smoke-noblur:   lens OFF (bloom+grade+tone on)
# V5 smoke-lensonly: bloom+grade OFF (lens+tone on)
# V6 smoke-gradeonly: lens+bloom OFF (grade+tone on)
# Trigger: Actions tab > "Smoke Test Template" > Run workflow.
name: Smoke Test Template

on:
  workflow_dispatch:

jobs:
  render:
    name: Post-chain bisection (30 frames x 3 variants)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Install ffmpeg (for the ffprobe check)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render V4 (lens OFF)
        run: |
          mkdir -p out
          npx remotion render src/index.ts TemplateShort out/smoke-noblur.mp4 --codec h264 --crf 16 --concurrency 1 --scale 1 --frames 0-29 --timeout 180000 --log=verbose --gl angle --chromium-flags='{"enable-unsafe-swiftshader":true}' --props '{"post":{"ink":false,"lens":false}}'
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name out/smoke-noblur.mp4
      - name: Render V5 (lens only)
        run: |
          npx remotion render src/index.ts TemplateShort out/smoke-lensonly.mp4 --codec h264 --crf 16 --concurrency 1 --scale 1 --frames 0-29 --timeout 180000 --log=verbose --gl angle --chromium-flags='{"enable-unsafe-swiftshader":true}' --props '{"post":{"ink":false,"bloom":false,"grade":false}}'
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name out/smoke-lensonly.mp4
      - name: Render V6 (grade only)
        run: |
          npx remotion render src/index.ts TemplateShort out/smoke-gradeonly.mp4 --codec h264 --crf 16 --concurrency 1 --scale 1 --frames 0-29 --timeout 180000 --log=verbose --gl angle --chromium-flags='{"enable-unsafe-swiftshader":true}' --props '{"post":{"ink":false,"lens":false,"bloom":false}}'
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name out/smoke-gradeonly.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-bisection
          path: out/smoke-*.mp4
          if-no-files-found: error
