# Renders the Henry Box Brown Short (Why Clips) in 4 parallel chunks on
# GitHub Actions CPU runners, then assembles the final 1080x1920 MP4.
# Trigger: Actions tab > "Render Henry Short" > Run workflow.
# Copy of .github/workflows/render.yml in WhyClips/why-clips-render.
name: Render Henry Short

on:
  workflow_dispatch:

jobs:
  render:
    name: Render chunk ${{ matrix.chunk.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - { name: c1, frames: "0-497" }
          - { name: c2, frames: "498-995" }
          - { name: c3, frames: "996-1493" }
          - { name: c4, frames: "1494-1991" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Render chunk
        run: |
          mkdir -p out
          npx remotion render src/index.ts HenryShort out/chunk-${{ matrix.chunk.name }}.mp4 --codec h264 --crf 16 --concurrency 2 --scale 0.25 --frames ${{ matrix.chunk.frames }} --timeout 180000 --props '{"post":{"dpr":1,"msaa":0,"lens":false,"bloom":false}}' --log=verbose
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.name }}
          path: out/chunk-${{ matrix.chunk.name }}.mp4
          if-no-files-found: error

  assemble:
    name: Assemble final video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: render
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Concat, upscale and mix audio
        run: |
          ls -la chunks
          printf "file 'chunk-c1.mp4'\nfile 'chunk-c2.mp4'\nfile 'chunk-c3.mp4'\nfile 'chunk-c4.mp4'\n" > chunks/chunks.txt
          ffmpeg -y -v error -f concat -safe 0 -i chunks/chunks.txt -c copy chunks/video-270.mp4
          ffmpeg -y -v error -i chunks/video-270.mp4 -vf scale=1080:1920 -c:v libx264 -crf 18 -pix_fmt yuv420p chunks/video-1080.mp4
          ffmpeg -y -v error -i chunks/video-1080.mp4 -i audio/voiceover.mp3 -i audio/music_sfx.wav -filter_complex "[1:a]apad[a1];[a1][2:a]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[aout]" -map 0:v -map "[aout]" -c:v copy -c:a aac -b:a 192k -shortest henry-box-brown-full-quality.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name henry-box-brown-full-quality.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: henry-box-brown-full-quality
          path: henry-box-brown-full-quality.mp4
          if-no-files-found: error
