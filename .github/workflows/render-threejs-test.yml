# 30-frame three.js render test (own from-scratch scene — no skill code).
# Trigger: Actions tab > "Render Three.js Test" > Run workflow.
name: Render Three.js Test

on:
  workflow_dispatch:

jobs:
  render:
    name: Render 30-frame three.js test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Install ffmpeg (for the ffprobe check)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render 30 frames
        run: |
          mkdir -p out
          echo "RENDER_START $(date -u +%FT%TZ)"
          npx remotion render src/index.ts ThreeTest out/threejs-test.mp4 --codec h264 --crf 16 --concurrency 1 --scale 1 --frames 0-29 --timeout 180000 --log=verbose --gl angle --chromium-flags='{"enable-unsafe-swiftshader":true}'
          echo "RENDER_END $(date -u +%FT%TZ)"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name,r_frame_rate out/threejs-test.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: threejs-test
          path: out/threejs-test.mp4
          if-no-files-found: error
